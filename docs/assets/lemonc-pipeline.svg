<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">LemonC compiler pipeline</title>
  <desc id="desc">Lemon source flows through lexer, parser, source AST, semantic Typed-AST construction, optimization, verified LemonIR, and JVM or LemonVM execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff8ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="260" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">LemonC: source code to dual-backend execution</text>
  <text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526070">A compact teaching compiler with visible stages and end-to-end runtime checks.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="38" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="97" y="152" font-weight="700" fill="#172033">.lemon</text>
      <text x="97" y="174" fill="#607080">source</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="188" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="247" y="152" font-weight="700" fill="#172033">Lexer</text>
      <text x="247" y="174" fill="#607080">tokens</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="338" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="397" y="152" font-weight="700" fill="#172033">Parser</text>
      <text x="397" y="174" fill="#607080">source AST</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="488" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="547" y="152" font-weight="700" fill="#172033">Semantic</text>
      <text x="547" y="174" fill="#607080">Typed-AST</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="638" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="697" y="152" font-weight="700" fill="#172033">Optimizer</text>
      <text x="697" y="174" fill="#607080">Typed-AST</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="788" y="122" width="118" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="847" y="152" font-weight="700" fill="#172033">LemonIR</text>
      <text x="847" y="174" fill="#607080">verified TAC</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="938" y="122" width="142" height="72" rx="10" fill="#172033" stroke="#172033"/>
      <text x="1009" y="152" font-weight="700" fill="#ffffff">JVM + VM</text>
      <text x="1009" y="174" fill="#cbd5e1">dual backends</text>
    </g>
  </g>
  <g stroke="#9fb4c8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 158h26"/>
    <path d="M178 151l8 7-8 7"/>
    <path d="M308 158h26"/>
    <path d="M328 151l8 7-8 7"/>
    <path d="M458 158h26"/>
    <path d="M478 151l8 7-8 7"/>
    <path d="M608 158h26"/>
    <path d="M628 151l8 7-8 7"/>
    <path d="M758 158h26"/>
    <path d="M778 151l8 7-8 7"/>
    <path d="M908 158h26"/>
    <path d="M928 151l8 7-8 7"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#526070">
    <text x="40" y="226">dual-backend regression</text>
    <text x="188" y="226">golden outputs</text>
    <text x="310" y="226">Java 8+</text>
    <text x="410" y="226">JVM + LemonVM</text>
    <text x="590" y="226">Apache-2.0</text>
  </g>
</svg>
